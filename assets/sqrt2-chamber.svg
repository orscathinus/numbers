<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">The Square Root of Two Chamber</title><desc id="d">A radiant unit square whose diagonal is labeled square root of two, surrounded by repeating twos from its continued fraction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset=".5" stop-color="#121028"/><stop offset="1" stop-color="#1e0d17"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="diag" x2="1"><stop stop-color="#6be7ff"/><stop offset="1" stop-color="#ff7b54"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g transform="translate(260 145)"><rect width="610" height="610" rx="10" fill="#6be7ff" fill-opacity=".035" stroke="#ffe267" stroke-width="4"/><g stroke="#fff" stroke-opacity=".07"><path d="M0 122H610M0 244H610M0 366H610M0 488H610M122 0V610M244 0V610M366 0V610M488 0V610"/></g><path d="M0 610L610 0" stroke="url(#diag)" stroke-width="10" filter="url(#g)"/><circle cx="0" cy="610" r="10" fill="#6be7ff"/><circle cx="610" cy="0" r="10" fill="#ff7b54"/><text x="345" y="278" transform="rotate(-45 345 278)" font-family="Georgia,serif" font-size="76" fill="#fff" filter="url(#g)">√2</text><text x="305" y="655" font-family="Georgia,serif" font-size="42" text-anchor="middle" fill="#ffe267">1</text><text x="-45" y="315" font-family="Georgia,serif" font-size="42" text-anchor="middle" fill="#ffe267">1</text></g><g font-family="system-ui,sans-serif"><text x="1010" y="150" fill="#fff" font-size="25" letter-spacing="7">THE DIAGONAL ESCAPES FRACTIONS</text><text x="1010" y="194" fill="#a8b7c8" font-size="18">√2 = 1.41421356237…</text><text x="1010" y="300" fill="#ff9f7d" font-size="20" letter-spacing="4">CONTINUED FRACTION</text><text x="1010" y="390" fill="#fff" font-family="Georgia,serif" font-size="62">[1; 2, 2, 2, 2, …]</text><text x="1010" y="500" fill="#6be7ff" font-size="20" letter-spacing="4">RATIONAL SHADOWS</text><text x="1010" y="580" fill="#fff" font-family="Georgia,serif" font-size="42">1, 3/2, 7/5, 17/12, 41/29 …</text><text x="1010" y="650" fill="#a8b7c8" font-size="18">Each convergent approaches the same irrational diagonal.</text></g><g fill="none" stroke="#fff" stroke-opacity=".08"><circle cx="1280" cy="720" r="115"/><circle cx="1280" cy="720" r="78"/><circle cx="1280" cy="720" r="38"/></g></svg>