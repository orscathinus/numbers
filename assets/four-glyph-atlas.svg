<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Glyph Corridor of Four</title><desc id="d">A perspective museum corridor displaying several written forms of four as illuminated historical objects, with chronology rails and architectural depth.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".48" stop-color="#12132f"/><stop offset="1" stop-color="#291126"/></linearGradient>
<linearGradient id="rail" x2="1"><stop stop-color="#57a6ff"/><stop offset=".25" stop-color="#8e6cff"/><stop offset=".52" stop-color="#ffd166"/><stop offset=".76" stop-color="#ff7f6a"/><stop offset="1" stop-color="#74f0c3"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.float{animation:f 7s ease-in-out infinite alternate}.blink{animation:b 4s ease-in-out infinite alternate}@keyframes f{to{transform:translateY(-7px)}}@keyframes b{to{opacity:.35}}@media(prefers-reduced-motion:reduce){.float,.blink{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="800" cy="390" rx="720" ry="420" fill="url(#halo)"/>
<!-- corridor architecture -->
<g fill="none" stroke="#fff" stroke-opacity=".08"><path d="M70 100L800 40L1530 100L1370 760L230 760Z"/><path d="M185 155L800 88L1415 155L1280 700L320 700Z"/><path d="M315 215L800 145L1285 215L1175 645L425 645Z"/><path d="M70 100L315 215M1530 100L1285 215M230 760L425 645M1370 760L1175 645"/></g>
<g stroke="#8fc9ff" stroke-opacity=".11"><path d="M0 900L565 625M1600 900L1035 625M210 900L630 625M1390 900L970 625M430 900L695 625M1170 900L905 625M650 900L760 625M950 900L840 625"/><path d="M130 828H1470M280 770H1320M430 720H1170M560 676H1040M670 645H930"/></g>
<!-- illuminated exhibits -->
<g class="float">
<g transform="translate(110 205)"><rect width="205" height="330" rx="28" fill="#081225" stroke="#57a6ff" stroke-opacity=".42"/><rect x="18" y="18" width="169" height="230" rx="20" fill="#0c1830" stroke="#fff" stroke-opacity=".07"/><text x="102" y="160" text-anchor="middle" fill="#8fc9ff" font-family="Georgia,serif" font-size="74">||||</text><text x="102" y="285" text-anchor="middle" fill="#a9b9d3" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">REPEATED MARKS</text><text x="102" y="309" text-anchor="middle" fill="#6f829f" font-family="system-ui,sans-serif" font-size="11">quantity before glyph</text></g>
<g transform="translate(342 185)"><rect width="205" height="350" rx="28" fill="#100d29" stroke="#8e6cff" stroke-opacity=".42"/><rect x="18" y="18" width="169" height="250" rx="20" fill="#171039" stroke="#fff" stroke-opacity=".07"/><text x="102" y="170" text-anchor="middle" fill="#cbbcff" font-family="Georgia,serif" font-size="108">IV</text><text x="102" y="305" text-anchor="middle" fill="#b6a8d5" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">ROMAN</text><text x="102" y="329" text-anchor="middle" fill="#7c7295" font-family="system-ui,sans-serif" font-size="11">IV and historical IIII</text></g>
<g transform="translate(575 158)"><rect width="220" height="392" rx="30" fill="#181320" stroke="#ffd166" stroke-opacity=".48"/><rect x="18" y="18" width="184" height="286" rx="20" fill="#201928" stroke="#fff" stroke-opacity=".08"/><text x="110" y="228" text-anchor="middle" fill="#ffe39a" font-family="Georgia,serif" font-size="210" font-weight="700" filter="url(#glow)">4</text><text x="110" y="344" text-anchor="middle" fill="#d2c5a0" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">WESTERN 4</text><text x="110" y="368" text-anchor="middle" fill="#968a70" font-family="system-ui,sans-serif" font-size="11">many typographic forms</text></g>
<g transform="translate(825 185)"><rect width="205" height="350" rx="28" fill="#211019" stroke="#ff7f6a" stroke-opacity=".42"/><rect x="18" y="18" width="169" height="250" rx="20" fill="#2b121b" stroke="#fff" stroke-opacity=".07"/><text x="102" y="176" text-anchor="middle" fill="#ffb4a6" font-family="Georgia,serif" font-size="120">٤</text><text x="102" y="305" text-anchor="middle" fill="#d7aba3" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">ARABIC-INDIC</text><text x="102" y="329" text-anchor="middle" fill="#9a746f" font-family="system-ui,sans-serif" font-size="11">regional numeral family</text></g>
<g transform="translate(1057 205)"><rect width="205" height="330" rx="28" fill="#081d1c" stroke="#74f0c3" stroke-opacity=".42"/><rect x="18" y="18" width="169" height="230" rx="20" fill="#0b2925" stroke="#fff" stroke-opacity=".07"/><text x="102" y="164" text-anchor="middle" fill="#a6ffdd" font-family="Georgia,serif" font-size="114">४</text><text x="102" y="285" text-anchor="middle" fill="#a8cfbf" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">DEVANAGARI</text><text x="102" y="309" text-anchor="middle" fill="#708d82" font-family="system-ui,sans-serif" font-size="11">Nagari descendants</text></g>
<g transform="translate(1280 230)"><rect width="205" height="305" rx="28" fill="#181025" stroke="#f2d5ff" stroke-opacity=".34"/><rect x="18" y="18" width="169" height="210" rx="20" fill="#21132f" stroke="#fff" stroke-opacity=".07"/><text x="102" y="154" text-anchor="middle" fill="#f2d5ff" font-family="Georgia,serif" font-size="112">四</text><text x="102" y="270" text-anchor="middle" fill="#c9b6d0" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">CHINESE</text><text x="102" y="292" text-anchor="middle" fill="#8c7892" font-family="system-ui,sans-serif" font-size="11">separate writing tradition</text></g>
</g>
<!-- chronology rail -->
<path d="M150 650H1450" stroke="url(#rail)" stroke-width="5" opacity=".52" filter="url(#glow)"/>
<g class="blink" fill="#fff"><circle cx="210" cy="650" r="8"/><circle cx="445" cy="650" r="8"/><circle cx="685" cy="650" r="8"/><circle cx="925" cy="650" r="8"/><circle cx="1160" cy="650" r="8"/><circle cx="1395" cy="650" r="8"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="800" y="732" fill="#fff" font-size="30" letter-spacing="4">THE NUMBER IS NOT THE GLYPH</text><text x="800" y="775" fill="#aab6ca" font-size="14" letter-spacing="3">BRAHMI · GUPTA · NAGARI · TRANSMISSION · PRINT · TYPOGRAPHY</text><text x="800" y="838" fill="#fff" opacity=".72" font-size="17" letter-spacing="7">GLYPH CORRIDOR · GALLERY 004</text></g>
</svg>