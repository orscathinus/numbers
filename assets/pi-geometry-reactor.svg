<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Pi Geometry Reactor</title><desc id="d">A circular mathematical reactor showing inscribed and circumscribed polygons, a radian arc, tangent geometry, integral notation, and converging perimeter bounds around pi.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030312"/><stop offset=".4" stop-color="#0b1532"/><stop offset=".72" stop-color="#21103c"/><stop offset="1" stop-color="#2c1026"/></linearGradient>
<radialGradient id="core"><stop stop-color="#bff8ff" stop-opacity=".24"/><stop offset=".26" stop-color="#5ee7ff" stop-opacity=".16"/><stop offset=".55" stop-color="#ff4fd8" stop-opacity=".1"/><stop offset="1" stop-color="#050514" stop-opacity="0"/></radialGradient>
<linearGradient id="rail"><stop stop-color="#5ee7ff"/><stop offset=".32" stop-color="#8b6cff"/><stop offset=".62" stop-color="#ff4fd8"/><stop offset=".82" stop-color="#ffd166"/><stop offset="1" stop-color="#78ffba"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.spin{transform-origin:800px 425px;animation:s 42s linear infinite}.spin2{transform-origin:800px 425px;animation:s2 55s linear infinite}.pulse{animation:p 4s ease-in-out infinite alternate}.dash{stroke-dasharray:10 16;animation:d 16s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@keyframes s2{to{transform:rotate(-360deg)}}@keyframes p{to{opacity:.95}}@keyframes d{to{stroke-dashoffset:-260}}@media(prefers-reduced-motion:reduce){.spin,.spin2,.pulse,.dash{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="430" rx="650" ry="400" fill="url(#core)"/>
<!-- reactor hall -->
<g fill="none" stroke="#fff" stroke-opacity=".075"><path d="M70 125L800 58L1530 125L1390 760L210 760Z"/><path d="M180 180L800 108L1420 180L1295 705L305 705Z"/><path d="M315 238L800 165L1285 238L1175 648L425 648Z"/></g>
<g stroke="#b8eaff" stroke-opacity=".1"><path d="M0 900L560 625M1600 900L1040 625M210 900L625 625M1390 900L975 625M430 900L690 625M1170 900L910 625M650 900L752 625M950 900L848 625"/><path d="M130 835H1470M270 785H1330M410 740H1190M540 700H1060M655 665H945"/></g>
<!-- main circle and polygons -->
<g transform="translate(800 425)" fill="none">
<circle r="285" stroke="#5ee7ff" stroke-width="7" filter="url(#glow)"/>
<polygon points="0,-285 247,-143 247,143 0,285 -247,143 -247,-143" stroke="#ff4fd8" stroke-width="4" opacity=".65" class="spin"/>
<polygon points="0,-328 232,-232 328,0 232,232 0,328 -232,232 -328,0 -232,-232" stroke="#ffd166" stroke-width="4" opacity=".52" class="spin2"/>
<circle r="225" stroke="#fff" stroke-opacity=".12"/><circle r="165" stroke="#8b6cff" stroke-opacity=".18" stroke-dasharray="8 15"/>
<path d="M0 0L285 0M0 0L202-202" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
<path d="M285 0A285 285 0 0 0 202-202" stroke="#78ffba" stroke-width="10" stroke-linecap="round" class="pulse" filter="url(#glow)"/>
</g>
<g filter="url(#glow)"><text x="800" y="470" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="110">π</text><text x="800" y="530" text-anchor="middle" fill="#a9f5ff" font-family="ui-monospace,monospace" font-size="24">perimeter → circumference</text></g>
<!-- left station: squeeze -->
<g transform="translate(85 205)"><rect width="330" height="330" rx="28" fill="#071126" stroke="#5ee7ff" stroke-opacity=".32"/><text x="28" y="50" fill="#96f3ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">ARCHIMEDEAN SQUEEZE</text><text x="28" y="108" fill="#fff" font-family="Georgia,serif" font-size="31">n sin(π/n) &lt; π</text><text x="28" y="153" fill="#fff" font-family="Georgia,serif" font-size="31">π &lt; n tan(π/n)</text><path d="M28 200H302" stroke="#5ee7ff" stroke-opacity=".24"/><text x="28" y="242" fill="#9fb0ca" font-family="ui-monospace,monospace" font-size="15">inside polygon → lower bound</text><text x="28" y="274" fill="#9fb0ca" font-family="ui-monospace,monospace" font-size="15">outside polygon → upper bound</text><text x="28" y="307" fill="#ffd166" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">MORE SIDES · NARROWER GAP</text></g>
<!-- right station: radians -->
<g transform="translate(1185 205)"><rect width="330" height="330" rx="28" fill="#190d28" stroke="#ff4fd8" stroke-opacity=".3"/><text x="28" y="50" fill="#ff9ce9" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">RADIAN CHAMBER</text><circle cx="165" cy="165" r="90" fill="none" stroke="#fff" stroke-opacity=".14"/><path d="M165 165L255 165M165 165L228 102" stroke="#fff" stroke-opacity=".32" stroke-width="3"/><path d="M255 165A90 90 0 0 0 228 102" fill="none" stroke="#ffd166" stroke-width="8"/><text x="165" y="290" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="28">arc length = rθ</text><text x="165" y="314" text-anchor="middle" fill="#a996b5" font-family="system-ui,sans-serif" font-size="12">θ measured in radians</text></g>
<!-- lower analysis panels -->
<g transform="translate(95 605)"><rect width="390" height="145" rx="22" fill="#07101f" stroke="#8b6cff" stroke-opacity=".24"/><text x="24" y="40" fill="#c5b7ff" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">INTEGRAL PORTAL</text><text x="24" y="90" fill="#fff" font-family="Georgia,serif" font-size="28">π = 4∫₀¹ dx/(1+x²)</text><text x="24" y="120" fill="#94a1b8" font-family="system-ui,sans-serif" font-size="12">circle constant reconstructed analytically</text></g>
<g transform="translate(1115 605)"><rect width="390" height="145" rx="22" fill="#19101c" stroke="#ffd166" stroke-opacity=".24"/><text x="24" y="40" fill="#ffe39a" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">SERIES PORTAL</text><text x="24" y="90" fill="#fff" font-family="Georgia,serif" font-size="25">π/4 = 1 − 1/3 + 1/5 − …</text><text x="24" y="120" fill="#a59a83" font-family="system-ui,sans-serif" font-size="12">exact limit · painfully slow convergence</text></g>
<path d="M415 370H500M1100 370H1185M485 675H610M990 675H1115" stroke="url(#rail)" stroke-width="4" opacity=".42" filter="url(#glow)"/>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="800" y="820" fill="#fff" font-size="23" letter-spacing="8">GEOMETRY REACTOR · SPECIAL EXHIBIT π</text><text x="800" y="855" fill="#aeb0c8" font-size="13" letter-spacing="4">CIRCLE · POLYGON · RADIAN · INTEGRAL · SERIES</text></g>
</svg>