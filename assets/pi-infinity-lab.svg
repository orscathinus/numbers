<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Infinity Laboratory of Pi</title><desc id="d">A cinematic mathematical laboratory with stations for Monte Carlo estimation, polygon bounds, infinite series, Buffon needles, circle measurement, and a tunnel of pi digits.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020311"/><stop offset=".38" stop-color="#0a1730"/><stop offset=".7" stop-color="#23113d"/><stop offset="1" stop-color="#0a1b25"/></linearGradient>
<radialGradient id="core"><stop stop-color="#ffffff" stop-opacity=".2"/><stop offset=".22" stop-color="#5ee7ff" stop-opacity=".16"/><stop offset=".48" stop-color="#ff4fd8" stop-opacity=".1"/><stop offset="1" stop-color="#050514" stop-opacity="0"/></radialGradient>
<linearGradient id="rail"><stop stop-color="#5ee7ff"/><stop offset=".25" stop-color="#8b6cff"/><stop offset=".5" stop-color="#ff4fd8"/><stop offset=".75" stop-color="#ffd166"/><stop offset="1" stop-color="#78ffba"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.scan{animation:s 7s linear infinite}.pulse{animation:p 4s ease-in-out infinite alternate}.orbit{transform-origin:800px 420px;animation:o 45s linear infinite}.rain{animation:r 3s ease-in-out infinite alternate}@keyframes s{to{transform:translateY(180px)}}@keyframes p{to{opacity:.42}}@keyframes o{to{transform:rotate(360deg)}}@keyframes r{to{transform:translateY(7px)}}@media(prefers-reduced-motion:reduce){.scan,.pulse,.orbit,.rain{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="420" rx="700" ry="420" fill="url(#core)"/>
<!-- laboratory shell -->
<g fill="none" stroke="#fff" stroke-opacity=".07"><path d="M65 120L800 48L1535 120L1395 765L205 765Z"/><path d="M180 178L800 102L1420 178L1295 710L305 710Z"/><path d="M315 238L800 162L1285 238L1170 650L430 650Z"/></g>
<g stroke="#b9ecff" stroke-opacity=".1"><path d="M0 900L560 625M1600 900L1040 625M210 900L625 625M1390 900L975 625M430 900L690 625M1170 900L910 625M650 900L752 625M950 900L848 625"/><path d="M130 837H1470M275 787H1325M420 742H1180M555 702H1045M675 666H925"/></g>
<!-- central reactor -->
<g transform="translate(800 418)" fill="none"><circle r="245" stroke="#5ee7ff" stroke-width="5" filter="url(#glow)"/><rect x="-245" y="-245" width="490" height="490" stroke="#ff4fd8" stroke-opacity=".48" stroke-width="4"/><polygon points="0,-245 212,-122 212,122 0,245 -212,122 -212,-122" stroke="#ffd166" stroke-opacity=".34" stroke-width="3" class="orbit"/><circle r="175" stroke="#8b6cff" stroke-opacity=".18" stroke-dasharray="9 15"/></g>
<g filter="url(#glow)"><text x="800" y="500" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="255">π</text><text x="800" y="560" text-anchor="middle" fill="#a9f4ff" font-family="ui-monospace,monospace" font-size="18">MEASURE · SQUEEZE · SAMPLE · SUM</text></g>
<!-- Monte Carlo station -->
<g transform="translate(70 175)"><rect width="350" height="280" rx="28" fill="#071227" stroke="#5ee7ff" stroke-opacity=".28"/><text x="28" y="48" fill="#92f2ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">MONTE CARLO RAIN</text><rect x="45" y="78" width="180" height="180" fill="none" stroke="#fff" stroke-opacity=".14"/><path d="M45 258A180 180 0 0 1 225 78" fill="none" stroke="#5ee7ff" stroke-width="4"/><g fill="#78ffba" class="rain"><circle cx="78" cy="219" r="5"/><circle cx="110" cy="170" r="4"/><circle cx="150" cy="200" r="5"/><circle cx="195" cy="132" r="4"/><circle cx="92" cy="118" r="4"/><circle cx="205" cy="225" r="4"/></g><g fill="#ff4fd8"><circle cx="238" cy="100" r="4"/><circle cx="250" cy="220" r="4"/><circle cx="230" cy="175" r="4"/></g><text x="250" y="136" fill="#fff" font-family="Georgia,serif" font-size="24">4·inside</text><text x="250" y="166" fill="#fff" font-family="Georgia,serif" font-size="24">────────</text><text x="250" y="196" fill="#fff" font-family="Georgia,serif" font-size="24">total</text></g>
<!-- Polygon station -->
<g transform="translate(1180 175)"><rect width="350" height="280" rx="28" fill="#1a0e28" stroke="#ff4fd8" stroke-opacity=".28"/><text x="28" y="48" fill="#ff9ce9" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">POLYGON SQUEEZE</text><circle cx="175" cy="157" r="86" fill="none" stroke="#5ee7ff" stroke-width="4"/><polygon points="175,71 249,114 249,200 175,243 101,200 101,114" fill="none" stroke="#ff4fd8" stroke-width="3"/><polygon points="175,54 264,105 264,209 175,260 86,209 86,105" fill="none" stroke="#ffd166" stroke-width="3"/><text x="175" y="267" text-anchor="middle" fill="#a997b0" font-family="system-ui,sans-serif" font-size="11">lower bound &lt; π &lt; upper bound</text></g>
<!-- Series station -->
<g transform="translate(75 515)"><rect width="380" height="205" rx="26" fill="#11102a" stroke="#8b6cff" stroke-opacity=".27"/><text x="28" y="46" fill="#c5b7ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">SERIES MARATHON</text><text x="28" y="95" fill="#fff" font-family="Georgia,serif" font-size="26">4(1 − 1/3 + 1/5 − …)</text><path d="M28 132H340" stroke="#fff" stroke-opacity=".1"/><g fill="#8b6cff"><rect x="28" y="150" width="45" height="20" rx="7"/><rect x="82" y="150" width="70" height="20" rx="7" opacity=".75"/><rect x="162" y="150" width="105" height="20" rx="7" opacity=".55"/><rect x="277" y="150" width="63" height="20" rx="7" opacity=".35"/></g><text x="28" y="193" fill="#8d91a8" font-family="system-ui,sans-serif" font-size="11">exact limit · deliberately slow convergence</text></g>
<!-- Buffon station -->
<g transform="translate(1145 515)"><rect width="380" height="205" rx="26" fill="#0a1b1b" stroke="#78ffba" stroke-opacity=".24"/><text x="28" y="46" fill="#a7ffd5" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">BUFFON FLOOR</text><g stroke="#fff" stroke-opacity=".14"><path d="M60 70V165M130 70V165M200 70V165M270 70V165M340 70V165"/></g><g stroke="#ffd166" stroke-width="5" stroke-linecap="round"><path d="M35 96L90 123M108 147L164 113M178 82L230 108M244 146L310 122M304 86L354 115"/></g><text x="28" y="193" fill="#8fa99c" font-family="system-ui,sans-serif" font-size="11">crossing frequency exposes a geometric probability involving π</text></g>
<!-- digit vault tunnel -->
<g transform="translate(500 675)"><rect width="600" height="112" rx="24" fill="#09091c" stroke="#ffd166" stroke-opacity=".22"/><text x="28" y="38" fill="#ffe39a" font-family="system-ui,sans-serif" font-size="13" letter-spacing="4">DIGIT VAULT</text><clipPath id="clip"><rect x="28" y="50" width="544" height="42" rx="8"/></clipPath><g clip-path="url(#clip)"><text x="28" y="80" fill="#d7d8ff" font-family="ui-monospace,monospace" font-size="22" letter-spacing="4">14159265358979323846264338327950288419716939937510…</text><rect x="28" y="50" width="70" height="42" fill="url(#rail)" opacity=".18" class="scan"/></g><text x="442" y="103" fill="#8f8fa6" font-family="system-ui,sans-serif" font-size="10">patterns observed ≠ normality proved</text></g>
<!-- connecting energy rails -->
<path d="M420 315H535M1065 315H1180M455 615H575M1025 615H1145" stroke="url(#rail)" stroke-width="4" opacity=".38" filter="url(#glow)"/>
<g class="pulse" filter="url(#glow)"><circle cx="245" cy="316" r="6" fill="#5ee7ff"/><circle cx="1355" cy="316" r="6" fill="#ff4fd8"/><circle cx="265" cy="615" r="6" fill="#8b6cff"/><circle cx="1335" cy="615" r="6" fill="#78ffba"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="800" y="835" fill="#fff" font-size="22" letter-spacing="8">INFINITY LABORATORY · SPECIAL EXHIBIT π</text><text x="800" y="868" fill="#aab0c4" font-size="13" letter-spacing="4">RIGOROUS BOUNDS · RANDOM ESTIMATES · INFINITE LIMITS · DIGITS</text></g>
</svg>