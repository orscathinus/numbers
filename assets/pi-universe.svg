<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Pi Universe Hall</title><desc id="d">An immersive museum hall showing pi emerging in waves, Gaussian probability, Fourier rotation, spherical geometry, and physics, all orbiting a central pi sculpture.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030312"/><stop offset=".35" stop-color="#0a1630"/><stop offset=".7" stop-color="#21103d"/><stop offset="1" stop-color="#071b28"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".28" stop-color="#5ee7ff" stop-opacity=".14"/><stop offset=".55" stop-color="#ff4fd8" stop-opacity=".09"/><stop offset="1" stop-color="#050514" stop-opacity="0"/></radialGradient>
<linearGradient id="rail"><stop stop-color="#5ee7ff"/><stop offset=".25" stop-color="#8b6cff"/><stop offset=".5" stop-color="#ff4fd8"/><stop offset=".75" stop-color="#ffd166"/><stop offset="1" stop-color="#78ffba"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.orbit{transform-origin:800px 420px;animation:o 54s linear infinite}.orbit2{transform-origin:800px 420px;animation:o2 72s linear infinite}.wave{animation:w 7s ease-in-out infinite alternate}.pulse{animation:p 4s ease-in-out infinite alternate}@keyframes o{to{transform:rotate(360deg)}}@keyframes o2{to{transform:rotate(-360deg)}}@keyframes w{to{transform:translateX(14px)}}@keyframes p{to{opacity:.45}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.wave,.pulse{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="420" rx="710" ry="420" fill="url(#halo)"/>
<g fill="none" stroke="#fff" stroke-opacity=".07"><path d="M70 125L800 55L1530 125L1390 760L210 760Z"/><path d="M185 180L800 105L1415 180L1290 705L310 705Z"/><path d="M320 238L800 165L1280 238L1170 648L430 648Z"/></g>
<g stroke="#b6e9ff" stroke-opacity=".09"><path d="M0 900L565 625M1600 900L1035 625M220 900L630 625M1380 900L970 625M440 900L695 625M1160 900L905 625"/><path d="M135 837H1465M280 787H1320M430 742H1170M560 702H1040M675 668H925"/></g>
<!-- orbital framework -->
<g class="orbit" fill="none"><ellipse cx="800" cy="420" rx="530" ry="300" stroke="url(#rail)" stroke-width="4" opacity=".34"/><ellipse cx="800" cy="420" rx="390" ry="220" stroke="#fff" stroke-opacity=".11"/><circle cx="800" cy="420" r="275" stroke="#8b6cff" stroke-opacity=".16" stroke-dasharray="10 18"/></g>
<g class="orbit2" fill="none"><ellipse cx="800" cy="420" rx="310" ry="390" stroke="#ffd166" stroke-opacity=".14" transform="rotate(35 800 420)"/><ellipse cx="800" cy="420" rx="245" ry="430" stroke="#5ee7ff" stroke-opacity=".12" transform="rotate(-28 800 420)"/></g>
<!-- central pi -->
<g filter="url(#glow)"><circle cx="800" cy="420" r="145" fill="#0d102b" stroke="#fff" stroke-opacity=".12"/><text x="800" y="520" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="335">π</text></g>
<!-- WAVE chamber -->
<g transform="translate(80 205)"><rect width="340" height="260" rx="28" fill="#071227" stroke="#5ee7ff" stroke-opacity=".28"/><text x="28" y="48" fill="#91f1ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">WAVES + PERIODICITY</text><g class="wave" fill="none"><path d="M26 135C62 55 105 215 148 135S234 55 314 135" stroke="#5ee7ff" stroke-width="4"/><path d="M26 170C62 90 105 250 148 170S234 90 314 170" stroke="#ff4fd8" stroke-width="3" opacity=".75"/></g><text x="28" y="225" fill="#fff" font-family="Georgia,serif" font-size="24">period = 2π / ω</text></g>
<!-- GAUSSIAN chamber -->
<g transform="translate(1180 205)"><rect width="340" height="260" rx="28" fill="#171025" stroke="#ff4fd8" stroke-opacity=".28"/><text x="28" y="48" fill="#ff9de9" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">GAUSSIAN PROBABILITY</text><path d="M28 194C84 194 98 176 126 123S168 70 198 123S240 194 312 194" fill="none" stroke="#ff4fd8" stroke-width="5" filter="url(#glow)"/><path d="M28 194H312" stroke="#fff" stroke-opacity=".18"/><text x="170" y="232" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22">1 / √(2πσ²)</text></g>
<!-- FOURIER chamber -->
<g transform="translate(110 530)"><rect width="340" height="220" rx="28" fill="#11102a" stroke="#8b6cff" stroke-opacity=".27"/><text x="28" y="48" fill="#c5b7ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">FOURIER ROTATION</text><circle cx="110" cy="132" r="58" fill="none" stroke="#fff" stroke-opacity=".13"/><path d="M110 132L160 97" stroke="#ffd166" stroke-width="4"/><path d="M185 92C225 60 260 185 310 145" fill="none" stroke="#5ee7ff" stroke-width="4"/><text x="28" y="198" fill="#a29caf" font-family="system-ui,sans-serif" font-size="12">complex rotation decomposes signals</text></g>
<!-- SPHERE chamber -->
<g transform="translate(1150 530)"><rect width="340" height="220" rx="28" fill="#0a1b1b" stroke="#78ffba" stroke-opacity=".25"/><text x="28" y="48" fill="#a6ffd5" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">SPHERES + DIMENSION</text><ellipse cx="170" cy="126" rx="78" ry="78" fill="none" stroke="#78ffba" stroke-width="3"/><ellipse cx="170" cy="126" rx="78" ry="28" fill="none" stroke="#5ee7ff" stroke-opacity=".6"/><path d="M92 126H248" stroke="#fff" stroke-opacity=".16"/><text x="28" y="198" fill="#97b3a7" font-family="system-ui,sans-serif" font-size="12">π enters areas and volumes in many dimensions</text></g>
<!-- physics bridge -->
<g transform="translate(520 655)"><rect width="560" height="115" rx="24" fill="#15111e" stroke="#ffd166" stroke-opacity=".22"/><text x="28" y="40" fill="#ffe39a" font-family="system-ui,sans-serif" font-size="13" letter-spacing="4">PHYSICS BRIDGE</text><text x="28" y="78" fill="#fff" font-family="Georgia,serif" font-size="24">rotation · oscillation · fields · quantum phases</text><text x="28" y="101" fill="#9f9582" font-family="system-ui,sans-serif" font-size="11">π appears when physical laws inherit circular, angular, periodic, or Fourier structure</text></g>
<!-- connectors -->
<path d="M420 330H535M1065 330H1180M450 625H555M1045 625H1150" stroke="url(#rail)" stroke-width="4" opacity=".35"/>
<g class="pulse" filter="url(#glow)"><circle cx="270" cy="340" r="6" fill="#5ee7ff"/><circle cx="1350" cy="340" r="6" fill="#ff4fd8"/><circle cx="280" cy="640" r="6" fill="#8b6cff"/><circle cx="1320" cy="640" r="6" fill="#78ffba"/><circle cx="800" cy="420" r="8" fill="#ffd166"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="800" y="835" fill="#fff" font-size="22" letter-spacing="8">π UNIVERSE · SPECIAL EXHIBIT 001</text><text x="800" y="868" fill="#aab0c4" font-size="13" letter-spacing="4">NOT MAGIC · SHARED STRUCTURE ACROSS GEOMETRY, ANALYSIS, PROBABILITY, AND PHYSICS</text></g>
</svg>