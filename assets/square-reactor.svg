<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Square Reactor</title><desc id="d">A deep mathematical reactor built from nested squares, modular clockwork, divisor channels, fourth roots of unity, and illuminated factor panels.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".5" stop-color="#0c1740"/><stop offset="1" stop-color="#190f2f"/></linearGradient><radialGradient id="core"><stop stop-color="#dff6ff" stop-opacity=".3"/><stop offset=".23" stop-color="#57a6ff" stop-opacity=".22"/><stop offset=".55" stop-color="#8e6cff" stop-opacity=".12"/><stop offset="1" stop-color="#050814" stop-opacity="0"/></radialGradient><linearGradient id="beam"><stop stop-color="#57a6ff"/><stop offset=".48" stop-color="#c8b7ff"/><stop offset=".72" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7f6a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="440" rx="570" ry="390" fill="url(#core)"/><g stroke="#b6d9ff" stroke-opacity=".09"><path d="M0 820L610 580M1600 820L990 580M250 900L665 580M1350 900L935 580M500 900L725 580M1100 900L875 580"/><path d="M140 760H1460M270 710H1330M390 665H1210M500 625H1100"/></g><g transform="translate(800 430)" fill="none"><rect x="-292" y="-292" width="584" height="584" rx="24" stroke="#57a6ff" stroke-opacity=".28" stroke-width="3"/><rect x="-232" y="-232" width="464" height="464" rx="18" stroke="#8e6cff" stroke-opacity=".32" stroke-width="3" transform="rotate(9)"/><rect x="-172" y="-172" width="344" height="344" rx="14" stroke="#ffd166" stroke-opacity=".42" stroke-width="4" transform="rotate(45)"/><rect x="-112" y="-112" width="224" height="224" rx="10" stroke="#ff7f6a" stroke-opacity=".38" stroke-width="3" transform="rotate(18)"/><circle r="330" stroke="#fff" stroke-opacity=".11"/><circle r="260" stroke="#57a6ff" stroke-opacity=".18" stroke-dasharray="8 14"/><path d="M0-330A330 330 0 0 1 330 0" stroke="#57a6ff" stroke-width="6"/><path d="M330 0A330 330 0 0 1 0 330" stroke="#8e6cff" stroke-width="6"/><path d="M0 330A330 330 0 0 1-330 0" stroke="#ffd166" stroke-width="6"/><path d="M-330 0A330 330 0 0 1 0-330" stroke="#ff7f6a" stroke-width="6"/></g><g filter="url(#glow)"><text x="800" y="430" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="118">2² = 4</text><text x="800" y="510" text-anchor="middle" fill="#ffd166" font-family="Georgia,serif" font-size="42">1 · 2 · 4</text></g><g transform="translate(86 160)"><rect width="300" height="250" rx="20" fill="#071027" stroke="#57a6ff" stroke-opacity=".3"/><text x="26" y="46" fill="#8fc8ff" font-family="system-ui,sans-serif" font-size="15" letter-spacing="4">DIVISOR CHANNEL</text><text x="26" y="95" fill="#fff" font-family="Georgia,serif" font-size="35">τ(4)=3</text><text x="26" y="137" fill="#fff" font-family="Georgia,serif" font-size="35">σ(4)=7</text><text x="26" y="179" fill="#fff" font-family="Georgia,serif" font-size="35">φ(4)=2</text><path d="M25 213H275" stroke="#57a6ff" stroke-opacity=".3"/></g><g transform="translate(1215 160)"><rect width="300" height="250" rx="20" fill="#100d25" stroke="#ffd166" stroke-opacity=".28"/><text x="25" y="46" fill="#ffe6a2" font-family="system-ui,sans-serif" font-size="15" letter-spacing="4">ROOTS OF UNITY</text><g transform="translate(150 142)" fill="none"><circle r="72" stroke="#fff" stroke-opacity=".15"/><path d="M-72 0H72M0-72V72" stroke="#fff" stroke-opacity=".16"/></g><g fill="#fff" font-family="Georgia,serif" font-size="20"><text x="230" y="148">1</text><text x="144" y="58">i</text><text x="55" y="148">−1</text><text x="138" y="235">−i</text></g></g><g transform="translate(95 520)"><rect width="340" height="190" rx="18" fill="#091023" stroke="#8e6cff" stroke-opacity=".28"/><text x="24" y="43" fill="#c9bfff" font-family="system-ui,sans-serif" font-size="15" letter-spacing="4">MOD 4 CLOCK</text><g fill="#fff" font-family="Georgia,serif" font-size="34"><text x="160" y="86">0</text><text x="245" y="135">1</text><text x="160" y="176">2</text><text x="72" y="135">3</text></g><circle cx="170" cy="128" r="64" fill="none" stroke="#8e6cff" stroke-opacity=".35"/></g><g transform="translate(1160 520)"><rect width="350" height="190" rx="18" fill="#120d20" stroke="#ff7f6a" stroke-opacity=".25"/><text x="24" y="43" fill="#ffc0b3" font-family="system-ui,sans-serif" font-size="15" letter-spacing="4">FOUR SQUARES</text><text x="24" y="96" fill="#fff" font-family="Georgia,serif" font-size="28">n=a²+b²+c²+d²</text><text x="24" y="137" fill="#a7b5d0" font-family="ui-monospace,monospace" font-size="16">every n ≥ 0</text><text x="24" y="165" fill="#a7b5d0" font-family="ui-monospace,monospace" font-size="16">Lagrange · 1770</text></g><path d="M405 285H510M1090 285H1215M435 615H500M1100 615H1160" stroke="url(#beam)" stroke-width="4" opacity=".52" filter="url(#glow)"/><g font-family="system-ui,sans-serif" fill="#fff" opacity=".72" font-size="16" letter-spacing="5"><text x="85" y="90">SMALLEST COMPOSITE</text><text x="1245" y="90">FIRST EVEN SQUARE</text><text x="680" y="842">SQUARE REACTOR · GALLERY 004</text></g></svg>