<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Triangle Reactor</title><desc id="d">A vivid mathematical reactor centered on the number three with an equilateral triangle, cube roots of unity, and prime symbols.</desc><defs><radialGradient id="bg"><stop stop-color="#18102e"/><stop offset=".58" stop-color="#07131d"/><stop offset="1" stop-color="#05070d"/></radialGradient><linearGradient id="g" x2="1"><stop stop-color="#b58cff"/><stop offset=".5" stop-color="#dfff72"/><stop offset="1" stop-color="#ff8068"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><g opacity=".15" stroke="#fff"><path d="M0 562h1200M0 450h1200M0 338h1200M0 226h1200M0 114h1200"/><path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675"/></g><circle cx="600" cy="335" r="260" fill="none" stroke="#9d78ff" stroke-opacity=".35"/><circle cx="600" cy="335" r="205" fill="none" stroke="#dfff72" stroke-opacity=".3" stroke-dasharray="8 12"/><path d="M600 112 826 503 374 503Z" fill="#fff" fill-opacity=".018" stroke="url(#g)" stroke-width="5" filter="url(#gl)"/><circle cx="600" cy="335" r="86" fill="#0b1220" stroke="#fff" stroke-opacity=".18"/><text x="600" y="404" text-anchor="middle" font-family="Georgia,serif" font-size="210" fill="url(#g)" filter="url(#gl)">3</text><g font-family="Georgia,serif" font-size="42" fill="#f7f4ef"><text x="175" y="180">3 is prime</text><text x="855" y="180">T₂ = 3</text><text x="154" y="545">1 + 2 = 3</text><text x="825" y="545">3! = 6</text></g><g transform="translate(950 336)"><circle r="92" fill="none" stroke="#70e9ff" stroke-width="2"/><circle cx="92" r="8" fill="#dfff72"/><circle cx="-46" cy="79.7" r="8" fill="#ff8068"/><circle cx="-46" cy="-79.7" r="8" fill="#b58cff"/><path d="M0 0 92 0M0 0-46 79.7M0 0-46-79.7" stroke="#fff" stroke-opacity=".42"/><text x="0" y="132" text-anchor="middle" fill="#d5d8df" font-family="Inter,Arial" font-size="15">z³ = 1</text></g><g filter="url(#gl)"><circle cx="600" cy="112" r="9" fill="#dfff72"/><circle cx="826" cy="503" r="9" fill="#ff8068"/><circle cx="374" cy="503" r="9" fill="#b58cff"/></g><text x="600" y="56" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="18" letter-spacing="5">MATHEMATICS WING · THREEFOLD STRUCTURE</text></svg>