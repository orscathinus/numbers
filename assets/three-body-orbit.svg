<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Three-Body Chamber</title><desc id="d">Three glowing bodies trace intertwined orbital paths around a triangular field.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#110820"/><stop offset=".55" stop-color="#07131c"/><stop offset="1" stop-color="#100a0a"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><g fill="none" stroke-width="3" opacity=".74"><path d="M185 352C295 72 635 77 600 330S965 607 1015 337 700 63 590 335 240 620 185 352Z" stroke="#a982ff"/><path d="M205 300C403 600 768 600 625 345S725 75 994 273 870 596 605 347 100 110 205 300Z" stroke="#dfff72"/><path d="M170 400C420 140 770 85 615 330S590 640 1020 397 900 120 608 337 31 570 170 400Z" stroke="#ff8068"/></g><path d="M600 115 858 505 342 505Z" fill="none" stroke="#fff" stroke-opacity=".13"/><g filter="url(#gl)"><circle cx="337" cy="245" r="22" fill="#a982ff"/><circle cx="861" cy="247" r="22" fill="#dfff72"/><circle cx="600" cy="526" r="22" fill="#ff8068"/></g><g fill="#fff" text-anchor="middle" font-family="Georgia,serif"><text x="337" y="253" font-size="24">A</text><text x="861" y="255" font-size="24">B</text><text x="600" y="534" font-size="24">C</text><text x="600" y="403" font-size="190" opacity=".95">3</text></g><g fill="#c8ced6" font-family="Inter,Arial" text-anchor="middle"><text x="600" y="47" fill="#fff" font-size="18" letter-spacing="5">THE THREE-BODY CHAMBER</text><text x="600" y="615" font-size="17">Adding a third gravitating body can produce dynamics far richer than the two-body case.</text><text x="600" y="640" font-size="13" opacity=".7">Lagrange found five equilibrium configurations in the restricted three-body problem.</text></g></svg>