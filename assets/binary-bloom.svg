<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Binary bloom</title><desc id="d">A radiant field of binary digits organized around a central one, suggesting computation and information.</desc><defs><radialGradient id="bg"><stop stop-color="#143448"/><stop offset=".45" stop-color="#10233f"/><stop offset="1" stop-color="#070814"/></radialGradient><filter id="gl"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="700" fill="url(#bg)"/><g font-family="monospace" font-size="42" fill="#69e3ff" opacity=".45"><text x="70" y="110">01001101 101001 0001</text><text x="140" y="190">10110010 010101 1110</text><text x="55" y="600">00101011 110001 0101</text><text x="660" y="120">11010001 001110 1001</text><text x="690" y="610">10101100 011010 0010</text></g><g fill="none" stroke="#6be7ff" opacity=".22"><circle cx="600" cy="350" r="110"/><circle cx="600" cy="350" r="220"/><circle cx="600" cy="350" r="315" stroke-dasharray="10 18"/></g><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="470" fill="#fff" filter="url(#gl)">1</text><g fill="#ff5bb5"><circle cx="600" cy="80" r="8"/><circle cx="885" cy="350" r="8"/></g><g fill="#ffe567"><circle cx="315" cy="350" r="8"/><circle cx="600" cy="620" r="8"/></g></svg>