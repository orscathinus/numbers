<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Constellation of One</title><desc id="d">Different written forms for one displayed as illuminated artifacts around a central numeral.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#200620"/><stop offset=".48" stop-color="#100d32"/><stop offset="1" stop-color="#031d32"/></linearGradient><linearGradient id="ring" x2="1"><stop stop-color="#ff58ad"/><stop offset=".5" stop-color="#ffe267"/><stop offset="1" stop-color="#6be7ff"/></linearGradient><radialGradient id="halo"><stop stop-color="#ffe267" stop-opacity=".72"/><stop offset="1" stop-color="#ff58ad" stop-opacity="0"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="900" fill="url(#bg)"/><circle cx="700" cy="450" r="270" fill="url(#halo)" opacity=".28"/><g fill="none" stroke="url(#ring)" opacity=".42"><circle cx="700" cy="450" r="320" stroke-width="3"/><circle cx="700" cy="450" r="250" stroke-dasharray="8 14"/><circle cx="700" cy="450" r="180"/></g><text x="700" y="585" text-anchor="middle" font-family="Georgia,serif" font-size="410" fill="#fff5b2" stroke="#ffb33c" stroke-width="2" filter="url(#g)">1</text><g font-family="Georgia,serif" font-size="92" text-anchor="middle"><g transform="translate(230 220)"><rect x="-105" y="-105" width="210" height="210" rx="34" fill="#2b102f" stroke="#ff58ad"/><text y="32" fill="#ffd0e7">|</text><text y="145" fill="#ffc2df" font-family="Inter,Arial" font-size="18" letter-spacing="3">TALLY</text></g><g transform="translate(1170 220)"><rect x="-105" y="-105" width="210" height="210" rx="34" fill="#0e2435" stroke="#6be7ff"/><text y="32" fill="#d4f8ff">I</text><text y="145" fill="#d4f8ff" font-family="Inter,Arial" font-size="18" letter-spacing="3">ROMAN</text></g><g transform="translate(180 655)"><rect x="-105" y="-10