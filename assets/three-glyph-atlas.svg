<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Glyph Atlas of Three</title><desc id="d">A museum cabinet showing several written forms for the number three around a radiant central 3.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18091f"/><stop offset=".5" stop-color="#07131c"/><stop offset="1" stop-color="#161006"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#b58cff"/><stop offset=".5" stop-color="#dfff72"/><stop offset="1" stop-color="#ff8168"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="600" cy="337" r="220" fill="none" stroke="#fff" stroke-opacity=".08"/><circle cx="600" cy="337" r="160" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-dasharray="8 10"/><text x="600" y="445" text-anchor="middle" font-family="Georgia,serif" font-size="310" fill="url(#g)" filter="url(#gl)">3</text><g font-family="Georgia,serif" text-anchor="middle" fill="#f7f3ed"><g transform="translate(205 155)"><rect x="-115" y="-70" width="230" height="140" rx="20" fill="#fff" fill-opacity=".035" stroke="#b58cff" stroke-opacity=".55"/><text y="22" font-size="72">III</text><text y="52" font-family="Inter,Arial" font-size="13" fill="#bbb">ROMAN</text></g><g transform="translate(995 155)"><rect x="-115" y="-70" width="230" height="140" rx="20" fill="#fff" fill-opacity=".035" stroke="#ff8168" stroke-opacity=".55"/><text y="24" font-size="78">٣</text><text y="52" font-family="Inter,Arial" font-size="13" fill="#bbb">ARABIC-INDIC</text></g><g transform="translate(188 505)"><rect x="-115" y="-70" width="230" height="140" rx="20" fill="#fff" fill-opacity=".035" stroke="#dfff72" stroke-opacity=".55"/><text y="24" font-size="78">३</text><text y="52" font-family="Inter,Arial" font-size="13" fill="#bbb">DEVANAGARI</text></g><g transform="translate(1012 505)"><rect x="-115" y="-70" width="230" height="140" rx="20" fill="#fff" fill-opacity=".035" stroke="#70e9ff" stroke-opacity=".55"/><text y="24" font-size="78">三</text><text y="52" font-family="Inter,Arial" font-size="13" fill="#bbb">CHINESE</text></g></g><g stroke="#fff" stroke-opacity=".15"><path d="M320 155 456 260M880 155 744 260M303 505 455 415M897 505 745 415"/></g><g fill="#dfff72"><circle cx="600" cy="92" r="4"/><circle cx="600" cy="582" r="4"/></g><text x="600" y="45" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="18" letter-spacing="5">ONE QUANTITY · MANY SIGNS · THREE</text><text x="600" y="638" text-anchor="middle" fill="#bfc5cc" font-family="Inter,Arial" font-size="15">The abstract number is not identical to any one glyph used to write it.</text></svg>