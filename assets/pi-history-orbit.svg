<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">History Orbit of Pi</title><desc id="d">A circular museum chronology with illuminated stations for ancient approximations, Archimedes, Liu Hui, Zu Chongzhi, al-Kashi, William Jones, Euler, Lambert, Lindemann, and computation.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030312"/><stop offset=".36" stop-color="#121039"/><stop offset=".7" stop-color="#2a123f"/><stop offset="1" stop-color="#071d31"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#ff4fd8" stop-opacity=".1"/><stop offset=".7" stop-color="#5ee7ff" stop-opacity=".07"/><stop offset="1" stop-color="#050514" stop-opacity="0"/></radialGradient>
<linearGradient id="rail"><stop stop-color="#5ee7ff"/><stop offset=".25" stop-color="#8b6cff"/><stop offset=".5" stop-color="#ff4fd8"/><stop offset=".75" stop-color="#ffd166"/><stop offset="1" stop-color="#78ffba"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.orbit{transform-origin:800px 425px;animation:o 70s linear infinite}.pulse{animation:p 4.5s ease-in-out infinite alternate}.dash{stroke-dasharray:10 20;animation:d 24s linear infinite}@keyframes o{to{transform:rotate(360deg)}}@keyframes p{to{opacity:.45}}@keyframes d{to{stroke-dashoffset:-360}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.dash{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="420" rx="700" ry="420" fill="url(#halo)"/>
<g fill="none" stroke="#fff" stroke-opacity=".07"><path d="M80 125L800 55L1520 125L1390 760L210 760Z"/><path d="M190 180L800 105L1410 180L1290 705L310 705Z"/><path d="M325 238L800 165L1275 238L1170 648L430 648Z"/></g>
<g stroke="#b9ecff" stroke-opacity=".09"><path d="M0 900L555 625M1600 900L1045 625M225 900L625 625M1375 900L975 625M450 900L695 625M1150 900L905 625"/><path d="M140 836H1460M285 786H1315M430 742H1170M560 702H1040M675 668H925"/></g>
<!-- orbital rails -->
<g class="orbit" fill="none"><ellipse cx="800" cy="415" rx="520" ry="300" stroke="url(#rail)" stroke-width="4" opacity=".45" class="dash"/><ellipse cx="800" cy="415" rx="390" ry="226" stroke="#fff" stroke-opacity=".12"/><ellipse cx="800" cy="415" rx="265" ry="153" stroke="#ff4fd8" stroke-opacity=".18"/></g>
<!-- central object -->
<g filter="url(#glow)"><circle cx="800" cy="415" r="128" fill="#11102f" stroke="#fff" stroke-opacity=".13"/><text x="800" y="505" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="300">π</text></g>
<text x="800" y="568" text-anchor="middle" fill="#b7b9d2" font-family="ui-monospace,monospace" font-size="16">approximation → notation → proof → computation</text>
<!-- stations -->
<g font-family="system-ui,sans-serif">
<g transform="translate(100 190)"><rect width="300" height="150" rx="22" fill="#071126" stroke="#5ee7ff" stroke-opacity=".28"/><circle cx="36" cy="36" r="8" fill="#5ee7ff" filter="url(#glow)"/><text x="58" y="42" fill="#92f3ff" font-size="13" letter-spacing="3">ANCIENT APPROXIMATIONS</text><text x="26" y="88" fill="#fff" font-family="Georgia,serif" font-size="27">Egypt · Babylon</text><text x="26" y="120" fill="#93a3bd" font-size="12">practical values long before π notation</text></g>
<g transform="translate(120 505)"><rect width="300" height="160" rx="22" fill="#0b1029" stroke="#8b6cff" stroke-opacity=".28"/><circle cx="36" cy="36" r="8" fill="#8b6cff" filter="url(#glow)"/><text x="58" y="42" fill="#c5b7ff" font-size="13" letter-spacing="3">ARCHIMEDES</text><text x="26" y="88" fill="#fff" font-family="Georgia,serif" font-size="26">223/71 &lt; π &lt; 22/7</text><text x="26" y="122" fill="#99a2bd" font-size="12">polygon bounds · 3rd century BCE</text></g>
<g transform="translate(475 90)"><rect width="300" height="145" rx="22" fill="#13102a" stroke="#ff4fd8" stroke-opacity=".25"/><circle cx="36" cy="36" r="8" fill="#ff4fd8" filter="url(#glow)"/><text x="58" y="42" fill="#ff9de9" font-size="13" letter-spacing="3">CHINA</text><text x="26" y="86" fill="#fff" font-family="Georgia,serif" font-size="26">Liu Hui · Zu Chongzhi</text><text x="26" y="116" fill="#aa96b0" font-size="12">355/113 becomes a remarkable convergent</text></g>
<g transform="translate(825 90)"><rect width="300" height="145" rx="22" fill="#171220" stroke="#ffd166" stroke-opacity=".25"/><circle cx="36" cy="36" r="8" fill="#ffd166" filter="url(#glow)"/><text x="58" y="42" fill="#ffe39a" font-size="13" letter-spacing="3">AL-KĀSHĪ</text><text x="26" y="86" fill="#fff" font-family="Georgia,serif" font-size="26">high-precision calculation</text><text x="26" y="116" fill="#a89b82" font-size="12">15th-century Islamic mathematics</text></g>
<g transform="translate(1180 190)"><rect width="300" height="150" rx="22" fill="#20101c" stroke="#ff7da0" stroke-opacity=".25"/><circle cx="36" cy="36" r="8" fill="#ff7da0" filter="url(#glow)"/><text x="58" y="42" fill="#ffb1c6" font-size="13" letter-spacing="3">THE SYMBOL π</text><text x="26" y="88" fill="#fff" font-family="Georgia,serif" font-size="27">Jones · 1706</text><text x="26" y="120" fill="#ad8e98" font-size="12">Euler later helps standardize the notation</text></g>
<g transform="translate(1180 505)"><rect width="300" height="160" rx="22" fill="#071b1e" stroke="#78ffba" stroke-opacity=".25"/><circle cx="36" cy="36" r="8" fill="#78ffba" filter="url(#glow)"/><text x="58" y="42" fill="#a7ffd4" font-size="13" letter-spacing="3">PROOF ERA</text><text x="26" y="88" fill="#fff" font-family="Georgia,serif" font-size="24">Lambert → Lindemann</text><text x="26" y="120" fill="#88a99a" font-size="12">irrationality · then transcendence</text></g>
<g transform="translate(520 650)"><rect width="560" height="120" rx="22" fill="#0a1023" stroke="#fff" stroke-opacity=".11"/><text x="30" y="42" fill="#b9c7db" font-size="13" letter-spacing="3">COMPUTATION ERA</text><text x="30" y="80" fill="#fff" font-family="Georgia,serif" font-size="25">manual tables → machines → electronic computation</text><text x="30" y="104" fill="#8290a6" font-size="11">more digits do not change what π is; they expand what we can test and compute</text></g>
</g>
<path d="M400 265H470M1130 265H1180M420 580H505M1095 580H1180" stroke="url(#rail)" stroke-width="4" opacity=".36"/>
<g class="pulse" fill="#fff"><circle cx="278" cy="270" r="5"/><circle cx="290" cy="590" r="5"/><circle cx="625" cy="165" r="5"/><circle cx="975" cy="165" r="5"/><circle cx="1328" cy="270" r="5"/><circle cx="1328" cy="590" r="5"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="800" y="835" fill="#fff" font-size="22" letter-spacing="8">HISTORY ORBIT · SPECIAL EXHIBIT π</text><text x="800" y="868" fill="#aab0c6" font-size="13" letter-spacing="4">THE CONSTANT PRECEDES THE SYMBOL · THE PROOFS COME LATER</text></g>
</svg>