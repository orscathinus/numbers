<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ternary Cathedral</title><desc id="d">A glowing three-way branching tree illustrating powers of three and ternary digits.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#13091e"/><stop offset="1" stop-color="#040b10"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#ad85ff"/><stop offset=".52" stop-color="#dfff70"/><stop offset="1" stop-color="#ff8168"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><g stroke="url(#g)" fill="none" filter="url(#gl)" stroke-width="3"><path d="M600 100v90M600 190 300 320M600 190 600 320M600 190 900 320"/><path d="M300 320 170 480M300 320 300 480M300 320 430 480M600 320 470 480M600 320 600 480M600 320 730 480M900 320 770 480M900 320 900 480M900 320 1030 480"/></g><g font-family="Georgia,serif" text-anchor="middle"><circle cx="600" cy="100" r="54" fill="#101524" stroke="#dfff70" stroke-width="3"/><text x="600" y="126" font-size="82" fill="#dfff70">3</text><g font-size="34" fill="#f6f4ef"><circle cx="300" cy="320" r="34" fill="#131529" stroke="#ad85ff"/><text x="300" y="332">0</text><circle cx="600" cy="320" r="34" fill="#131529" stroke="#dfff70"/><text x="600" y="332">1</text><circle cx="900" cy="320" r="34" fill="#131529" stroke="#ff8168"/><text x="900" y="332">2</text></g><g font-size="25" fill="#fff"><text x="170" y="488">00</text><text x="300" y="488">01</text><text x="430" y="488">02</text><text x="470" y="488">10</text><text x="600" y="488">11</text><text x="730" y="488">12</text><text x="770" y="488">20</text><text x="900" y="488">21</text><text x="1030" y="488">22</text></g></g><g font-family="Inter,Arial" text-anchor="middle" fill="#d5d9df"><text x="600" y="45" font-size="18" letter-spacing="5">TERNARY CATHEDRAL</text><text x="600" y="580" font-size="22">one ternary digit: 3 states · two digits: 3² = 9 states · n digits: 3ⁿ states</text><text x="600" y="620" font-size="16" opacity=".68">base 3 uses the digits 0, 1, 2</text></g></svg>