<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Identity prism</title><desc id="d">A beam labeled x passes through a glowing one and emerges unchanged, visualizing the multiplicative identity.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07151d"/><stop offset=".5" stop-color="#16102d"/><stop offset="1" stop-color="#260b22"/></linearGradient><linearGradient id="beam" x1="0" x2="1"><stop stop-color="#56e0ff"/><stop offset=".48" stop-color="#fff06a"/><stop offset="1" stop-color="#ff55a7"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="700" rx="42" fill="url(#bg)"/><g opacity=".18" stroke="#fff"><path d="M70 130H1130M70 350H1130M70 570H1130"/><path d="M200 70V630M600 70V630M1000 70V630"/></g><path d="M110 350H1090" stroke="url(#beam)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/><polygon points="600,120 770,350 600,580 430,350" fill="#fff" fill-opacity=".06" stroke="#fff6a2" stroke-width="4"/><text x="600" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="310" fill="#fff3a0" filter="url(#g)">1</text><g font-family="Arial,sans-serif" font-size="64" font-weight="700"><text x="115" y="315" fill="#56e0ff">x</text><text x="1040" y="315" fill="#ff74b9">x</text></g><g font-family="Arial,sans-serif" font-size="26" fill="#fff" opacity=".8"><text x="105" y="405">input</text><text x="1010" y="405">unchanged</text></g></svg>