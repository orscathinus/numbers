<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">The Square Atrium of Four</title><desc id="d">A deep luminous museum atrium built from fourfold architecture, perspective squares, factor stations, a suspended number four, and quarter-turn geometry.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".34" stop-color="#081633"/><stop offset=".68" stop-color="#19103c"/><stop offset="1" stop-color="#28111f"/></linearGradient>
  <radialGradient id="vault"><stop stop-color="#a8dcff" stop-opacity=".24"/><stop offset=".22" stop-color="#57a6ff" stop-opacity=".18"/><stop offset=".48" stop-color="#8e6cff" stop-opacity=".12"/><stop offset=".72" stop-color="#ffd166" stop-opacity=".06"/><stop offset="1" stop-color="#050814" stop-opacity="0"/></radialGradient>
  <linearGradient id="four" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fdff"/><stop offset=".2" stop-color="#7dc2ff"/><stop offset=".47" stop-color="#b29aff"/><stop offset=".72" stop-color="#ffe49a"/><stop offset="1" stop-color="#ff9b89"/></linearGradient>
  <linearGradient id="rail"><stop stop-color="#57a6ff"/><stop offset=".33" stop-color="#8e6cff"/><stop offset=".67" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7f6a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <style>.pulse{animation:pulse 5s ease-in-out infinite alternate}.drift{animation:drift 18s ease-in-out infinite alternate}.spin{transform-origin:800px 410px;animation:spin 34s linear infinite}.spin2{transform-origin:800px 410px;animation:spin2 48s linear infinite}.blink{animation:blink 3.5s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.9}}@keyframes drift{to{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-360deg)}}@keyframes blink{to{opacity:.35}}@media(prefers-reduced-motion:reduce){.pulse,.drift,.spin,.spin2,.blink{animation:none}}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><ellipse cx="800" cy="390" rx="650" ry="410" fill="url(#vault)" class="pulse"/>
<g fill="none" stroke="#d9efff" stroke-opacity=".11"><path d="M80 160L800 42L1520 160L1390 715L210 715Z"/><path d="M180 205L800 92L1420 205L1300 665L300 665Z"/><path d="M300 252L800 144L1300 252L1190 614L410 614Z"/><path d="M430 300L800 202L1170 300L1070 568L530 568Z"/><path d="M80 160L430 300M1520 160L1170 300M210 715L530 568M1390 715L1070 568"/></g>
<g stroke="#9bd1ff" stroke-opacity=".12" fill="none"><path d="M0 900L590 594M1600 900L1010 594M170 900L640 594M1430 900L960 594M360 900L690 594M1240 900L910 594M555 900L742 594M1045 900L858 594"/><path d="M110 845H1490M245 790H1355M380 744H1220M500 704H1100M610 670H990M700 642H900"/></g>
<g class="spin" fill="none" stroke-linejoin="round"><rect x="480" y="90" width="640" height="640" rx="34" stroke="#57a6ff" stroke-opacity=".24" stroke-width="3"/><rect x="540" y="150" width="520" height="520" rx="28" stroke="#8e6cff" stroke-opacity=".28" stroke-width="3" transform="rotate(12 800 410)"/><rect x="600" y="210" width="400" height="400" rx="22" stroke="#ffd166" stroke-opacity=".32" stroke-width="3" transform="rotate(24 800 410)"/></g>
<g class="spin2" fill="none"><circle cx="800" cy="410" r="326" stroke="#fff" stroke-opacity=".07"/><circle cx="800" cy="410" r="276" stroke="url(#rail)" stroke-opacity=".28" stroke-width="4" stroke-dasharray="8 18"/></g>
<g class="drift"><g transform="translate(118 246)"><rect width="220" height="330" rx="24" fill="#071227" stroke="#57a6ff" stroke-opacity=".34"/><rect x="18" y="18" width="184" height="294" rx="18" fill="none" stroke="#fff" stroke-opacity=".06"/><text x="26" y="52" fill="#8fc9ff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">FACTOR TOWER</text><text x="110" y="150" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="78">2²</text><text x="110" y="210" text-anchor="middle" fill="#c7d7f3" font-family="ui-monospace,monospace" font-size="18">1 · 2 · 4</text><path d="M28 252H192" stroke="#57a6ff" stroke-opacity=".32"/><text x="110" y="292" text-anchor="middle" fill="#8fc9ff" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2">COMPOSITE</text></g><g transform="translate(1262 246)"><rect width="220" height="330" rx="24" fill="#110d29" stroke="#8e6cff" stroke-opacity=".34"/><rect x="18" y="18" width="184" height="294" rx="18" fill="none" stroke="#fff" stroke-opacity=".06"/><text x="26" y="52" fill="#cbbcff" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">ROOT TOWER</text><circle cx="110" cy="164" r="78" fill="none" stroke="#fff" stroke-opacity=".12"/><path d="M32 164H188M110 86V242" stroke="#fff" stroke-opacity=".14"/><g fill="#fff" font-family="Georgia,serif" font-size="24"><text x="190" y="171">1</text><text x="104" y="78">i</text><text x="10" y="171">−1</text><text x="98" y="270">−i</text></g><text x="110" y="304" text-anchor="middle" fill="#cbbcff" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2">QUARTER TURNS</text></g></g>
<g filter="url(#glow)"><path d="M700 250H910" stroke="url(#rail)" stroke-width="6" opacity=".55"/><path d="M800 205V610" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><text x="800" y="622" text-anchor="middle" font-family="Georgia,serif" font-size="560" font-weight="700" fill="url(#four)" stroke="#fff" stroke-opacity=".16" stroke-width="3">4</text></g>
<g filter="url(#glow)" class="blink"><circle cx="800" cy="82" r="8" fill="#57a6ff"/><circle cx="1128" cy="410" r="8" fill="#8e6cff"/><circle cx="800" cy="738" r="8" fill="#ffd166"/><circle cx="472" cy="410" r="8" fill="#ff7f6a"/></g>
<g transform="translate(105 690)"><rect width="330" height="116" rx="18" fill="#07101f" stroke="#57a6ff" stroke-opacity=".22"/><text x="22" y="36" fill="#8fc9ff" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">GROUP ORDER 4</text><text x="22" y="78" fill="#fff" font-family="Georgia,serif" font-size="27">C₄  ≠  V₄</text><text x="22" y="101" fill="#98a9c5" font-family="system-ui,sans-serif" font-size="13">same size · different structure</text></g><g transform="translate(1165 690)"><rect width="330" height="116" rx="18" fill="#17101e" stroke="#ffd166" stroke-opacity=".22"/><text x="22" y="36" fill="#ffe39a" font-family="system-ui,sans-serif" font-size="13" letter-spacing="3">SQUARE SIGNAL</text><text x="22" y="78" fill="#fff" font-family="Georgia,serif" font-size="27">4 = 2 × 2</text><text x="22" y="101" fill="#b8a994" font-family="system-ui,sans-serif" font-size="13">the first even perfect square</text></g>
<path d="M338 410H470M1130 410H1262" stroke="url(#rail)" stroke-width="5" opacity=".5" filter="url(#glow)"/><path d="M435 748H650M950 748H1165" stroke="url(#rail)" stroke-width="3" opacity=".3"/>
<g font-family="system-ui,sans-serif" fill="#fff"><text x="800" y="842" text-anchor="middle" font-size="22" letter-spacing="8" opacity=".8">THE SQUARE ATRIUM · GALLERY 004</text><text x="800" y="872" text-anchor="middle" font-size="13" letter-spacing="4" opacity=".44">FACTOR · SQUARE · QUARTER-TURN · FOURFOLD STRUCTURE</text></g>
</svg>